<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="781" viewBox="0 0 1120 781" role="img" aria-label="一次登录到底发生了什么：授权码 + PKCE"><title>一次登录到底发生了什么：授权码 + PKCE</title><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8.28" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#555555"/></marker></defs><rect width="1120" height="781" fill="#fbfaf7"/><text x="36" y="48" font-size="21" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">一次登录到底发生了什么：授权码 + PKCE</text><text x="36" y="82" font-size="11.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">实线 = 数据经前端通道；虚线 = 数据直接走后端通道，不经过浏览器</text><rect x="36" y="133.2" width="128" height="44" rx="8" fill="#8d99ae" stroke="#8d99ae" stroke-width="1"/><text x="100" y="155.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">用户 / Browser</text><line x1="100" y1="181.2" x2="100" y2="677.2" stroke="#c9c5bd" stroke-width="1" stroke-dasharray="4 3"/><rect x="336.9" y="133.2" width="128" height="44" rx="8" fill="#b7791f" stroke="#b7791f" stroke-width="1"/><text x="400.9" y="155.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">RP 前端 SPA</text><line x1="400.9" y1="181.2" x2="400.9" y2="677.2" stroke="#c9c5bd" stroke-width="1" stroke-dasharray="4 3"/><rect x="637.8" y="133.2" width="128" height="44" rx="8" fill="#2f855a" stroke="#2f855a" stroke-width="1"/><text x="701.8" y="155.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">RP 后端</text><line x1="701.8" y1="181.2" x2="701.8" y2="677.2" stroke="#c9c5bd" stroke-width="1" stroke-dasharray="4 3"/><rect x="938.7" y="133.2" width="128" height="44" rx="8" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><text x="1002.7" y="155.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">OP / IdP</text><line x1="1002.7" y1="181.2" x2="1002.7" y2="677.2" stroke="#c9c5bd" stroke-width="1" stroke-dasharray="4 3"/><line x1="103" y1="167.2" x2="396.9" y2="167.2" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><text x="250.5" y="157.2" font-size="11.5" fill="#1a1a1a" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">(1) 点击登录</text><text x="250.5" y="180.2" font-size="10" fill="#b7791f" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">state + nonce + code_challenge 先存本地</text><line x1="403.9" y1="223.2" x2="998.7" y2="223.2" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><text x="701.8" y="213.2" font-size="11.5" fill="#1a1a1a" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">(2) 302 /authorize</text><text x="701.8" y="236.2" font-size="10" fill="#b7791f" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">client_id · scope · state · nonce · code_challenge(S256)</text><line x1="999.7" y1="279.2" x2="104" y2="279.2" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><text x="551.4" y="269.2" font-size="11.5" fill="#1a1a1a" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">(3) 展示登录页</text><text x="551.4" y="292.2" font-size="10" fill="#b7791f" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">用户在 OP 域下输入凭据，RP 看不到密码</text><line x1="999.7" y1="335.2" x2="104" y2="335.2" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><text x="551.4" y="325.2" font-size="11.5" fill="#1a1a1a" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">(4) 302 redirect_uri</text><text x="551.4" y="348.2" font-size="10" fill="#b7791f" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">?code=...&amp;state=...</text><line x1="103" y1="391.2" x2="396.9" y2="391.2" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><text x="250.5" y="381.2" font-size="11.5" fill="#1a1a1a" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">(5) 浏览器带回 code</text><text x="250.5" y="404.2" font-size="10" fill="#b7791f" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">前端核对 state 是否等于本地存的值</text><line x1="403.9" y1="447.2" x2="697.8" y2="447.2" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><text x="551.4" y="437.2" font-size="11.5" fill="#1a1a1a" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">(6) 转交 code</text><line x1="704.8" y1="503.2" x2="998.7" y2="503.2" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="6 4"/><text x="852.3" y="493.2" font-size="11.5" fill="#1a1a1a" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">(7) POST /token</text><text x="852.3" y="516.2" font-size="10" fill="#b7791f" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">code + client_secret + code_verifier</text><line x1="999.7" y1="559.2" x2="705.8" y2="559.2" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="6 4"/><text x="852.3" y="549.2" font-size="11.5" fill="#1a1a1a" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">(8) 返回三种令牌</text><text x="852.3" y="572.2" font-size="10" fill="#b7791f" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">id_token / access_token / refresh_token</text><line x1="698.8" y1="615.2" x2="404.9" y2="615.2" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><text x="551.4" y="605.2" font-size="11.5" fill="#1a1a1a" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">(9) 回传 id_token</text><text x="551.4" y="628.2" font-size="10" fill="#b7791f" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">建立短期会话</text><line x1="397.9" y1="671.2" x2="104" y2="671.2" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><text x="250.5" y="661.2" font-size="11.5" fill="#1a1a1a" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">(10) 登录完成</text><text x="250.5" y="684.2" font-size="10" fill="#b7791f" font-weight="400" text-anchor="middle" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">验签、核 nonce、核 aud / iss / exp</text><text x="36" y="721.2" font-size="11" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">关键：code 只在浏览器里过一次就被换掉，access_token 与 id_token 永远不经过前端通道；code_verifier 只有发起请求的那个客户端知道，所以拦截 code 也换不到 token（RFC 7636 §4.1 / RFC 6749 §4.1）。</text></svg>
