<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="445" viewBox="0 0 1120 445" role="img" aria-label="演化主线：每一步都在补上一步的漏洞"><title>演化主线：每一步都在补上一步的漏洞</title><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10.12" refY="5.5" orient="auto-start-reverse"><path d="M0,0 L11,5.5 L0,11 z" fill="#c9c5bd"/></marker></defs><rect width="1120" height="445" fill="#fbfaf7"/><text x="36" y="48" font-size="21" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">演化主线：每一步都在补上一步的漏洞</text><text x="36" y="82" font-size="11.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">没有哪一代是设计失误，每一代都是在当时约束下的最优解</text><line x1="36" y1="242.2" x2="1068" y2="242.2" stroke="#c9c5bd" stroke-width="2.4"/><line x1="1066" y1="242.2" x2="1082" y2="242.2" stroke="#c9c5bd" stroke-width="2.4" marker-end="url(#ah)"/><line x1="111" y1="242.2" x2="111" y2="224.2" stroke="#8d99ae" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="104" y="235.2" width="14" height="14" rx="7" fill="#8d99ae" stroke="#ffffff" stroke-width="2.5"/><rect x="36" y="125.2" width="150" height="99" rx="8" fill="#ffffff" stroke="#8d99ae" stroke-width="1.6"/><text x="48" y="141.2" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">密码反模式</text><text x="48" y="156.6" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">每个站点各存一份密码；撞</text><text x="48" y="171.8" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">库、复用、明文泄露成为常</text><text x="48" y="187.1" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">态</text><text x="111" y="109.2" font-size="12.5" fill="#8d99ae" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">1990s–2000s</text><line x1="260.7" y1="242.2" x2="260.7" y2="260.2" stroke="#2b6cb0" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="253.7" y="235.2" width="14" height="14" rx="7" fill="#2b6cb0" stroke="#ffffff" stroke-width="2.5"/><rect x="185.7" y="260.2" width="150" height="99" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/><text x="197.7" y="276.2" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">SAML 2.0</text><text x="197.7" y="291.6" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">企业级联邦身份成立；但</text><text x="197.7" y="306.9" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">XML 签名复杂、移动端不</text><text x="197.7" y="322.1" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">友好</text><text x="260.7" y="375.2" font-size="12.5" fill="#2b6cb0" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">2005</text><line x1="410.3" y1="242.2" x2="410.3" y2="224.2" stroke="#2f855a" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="403.3" y="235.2" width="14" height="14" rx="7" fill="#2f855a" stroke="#ffffff" stroke-width="2.5"/><rect x="335.3" y="125.2" width="150" height="99" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/><text x="347.3" y="141.2" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">OAuth 1.0</text><text x="347.3" y="156.6" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">引入授权委托；签名算法繁</text><text x="347.3" y="171.8" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">琐，几乎无法在前端实现</text><text x="410.3" y="109.2" font-size="12.5" fill="#2f855a" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">2010</text><line x1="560" y1="242.2" x2="560" y2="260.2" stroke="#2b6cb0" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="553" y="235.2" width="14" height="14" rx="7" fill="#2b6cb0" stroke="#ffffff" stroke-width="2.5"/><rect x="485" y="260.2" width="150" height="99" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/><text x="497" y="276.2" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">OAuth 2.0</text><text x="497" y="291.6" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">Bearer token 与四种授权</text><text x="497" y="306.9" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">类型；用可组合性换掉复杂</text><text x="497" y="322.1" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">度</text><text x="560" y="375.2" font-size="12.5" fill="#2b6cb0" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">2012</text><line x1="709.7" y1="242.2" x2="709.7" y2="224.2" stroke="#b7791f" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="702.7" y="235.2" width="14" height="14" rx="7" fill="#b7791f" stroke="#ffffff" stroke-width="2.5"/><rect x="634.7" y="125.2" width="150" height="99" rx="8" fill="#ffffff" stroke="#b7791f" stroke-width="1.6"/><text x="646.7" y="141.2" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">OIDC Core 1.0</text><text x="646.7" y="156.6" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">在 OAuth 2.0 上补出认证</text><text x="646.7" y="171.8" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">层：id_token、userinfo、</text><text x="646.7" y="187.1" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">discovery</text><text x="709.7" y="109.2" font-size="12.5" fill="#b7791f" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">2014</text><line x1="859.3" y1="242.2" x2="859.3" y2="260.2" stroke="#2f855a" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="852.3" y="235.2" width="14" height="14" rx="7" fill="#2f855a" stroke="#ffffff" stroke-width="2.5"/><rect x="784.3" y="260.2" width="150" height="99" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/><text x="796.3" y="276.2" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">PKCE</text><text x="796.3" y="291.6" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">RFC 7636 堵住公共客户端</text><text x="796.3" y="306.9" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">的 code 拦截与注入</text><text x="859.3" y="375.2" font-size="12.5" fill="#2f855a" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">2015</text><line x1="1009" y1="242.2" x2="1009" y2="224.2" stroke="#b7791f" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="1002" y="235.2" width="14" height="14" rx="7" fill="#b7791f" stroke="#ffffff" stroke-width="2.5"/><rect x="934" y="125.2" width="150" height="99" rx="8" fill="#ffffff" stroke="#b7791f" stroke-width="1.6"/><text x="946" y="141.2" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">RFC 9700 BCP</text><text x="946" y="156.6" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">弃用隐式流与 ROPC；要</text><text x="946" y="171.8" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">求 PKCE、发送方约束</text><text x="1009" y="109.2" font-size="12.5" fill="#b7791f" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">2025</text><text x="36" y="377.2" font-size="11" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">读法：关注「下一代解决了什么」而不是「上一代多蠢」。RFC 9700（2025）不是新协议，而是把十几年的教训收敛成 BCP 强制项。</text></svg>
