<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="548" viewBox="0 0 1120 548" role="img" aria-label="三种令牌：谁该被谁验证，谁该被存在哪"><title>三种令牌：谁该被谁验证，谁该被存在哪</title><rect width="1120" height="548" fill="#fbfaf7"/><text x="36" y="48" font-size="21" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">三种令牌：谁该被谁验证，谁该被存在哪</text><text x="36" y="82" font-size="11.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">把三者当成同一种东西，是 OIDC 落地最常见的结构性错误</text><rect x="186" y="111.2" width="294.3" height="44" rx="7" fill="#2f855a" stroke="#2f855a" stroke-width="1"/><text x="333.2" y="133.2" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">ID Token</text><rect x="485.3" y="111.2" width="294.3" height="44" rx="7" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/><text x="632.5" y="133.2" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">Access Token</text><rect x="784.7" y="111.2" width="294.3" height="44" rx="7" fill="#b7791f" stroke="#b7791f" stroke-width="1"/><text x="931.8" y="133.2" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">Refresh Token</text><rect x="36" y="155.2" width="150" height="42" rx="5" fill="#efece5" stroke="#dcd8cf" stroke-width="1"/><text x="48" y="176.2" font-size="11" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">回答什么</text><rect x="186" y="155.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="198" y="176.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">你是谁（认证）</text><rect x="485.3" y="155.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="497.3" y="176.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">能访问什么（授权）</text><rect x="784.7" y="155.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="796.7" y="176.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">能否续期</text><rect x="36" y="197.2" width="150" height="42" rx="5" fill="#efece5" stroke="#dcd8cf" stroke-width="1"/><text x="48" y="218.2" font-size="11" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">格式</text><rect x="186" y="197.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="198" y="218.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">JWT（必须签名）</text><rect x="485.3" y="197.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="497.3" y="218.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">不透明串 或 JWT</text><rect x="784.7" y="197.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="796.7" y="218.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">不透明串</text><rect x="36" y="239.2" width="150" height="42" rx="5" fill="#efece5" stroke="#dcd8cf" stroke-width="1"/><text x="48" y="260.2" font-size="11" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">验证者</text><rect x="186" y="239.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="198" y="260.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">RP（客户端）</text><rect x="485.3" y="239.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="497.3" y="260.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">资源服务器</text><rect x="784.7" y="239.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="796.7" y="260.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">OP（授权服务器）</text><rect x="36" y="281.2" width="150" height="42" rx="5" fill="#efece5" stroke="#dcd8cf" stroke-width="1"/><text x="48" y="302.2" font-size="11" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">验证方式</text><rect x="186" y="281.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="198" y="302.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">JWKS 验签 + claim</text><rect x="485.3" y="281.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="497.3" y="302.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">内省 / 本地验签</text><rect x="784.7" y="281.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="796.7" y="302.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">OP 查库 + 轮换比对</text><rect x="36" y="323.2" width="150" height="42" rx="5" fill="#efece5" stroke="#dcd8cf" stroke-width="1"/><text x="48" y="344.2" font-size="11" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">典型寿命</text><rect x="186" y="323.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="198" y="344.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">分钟级</text><rect x="485.3" y="323.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="497.3" y="344.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">分钟~小时级</text><rect x="784.7" y="323.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="796.7" y="344.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">天~月级</text><rect x="36" y="365.2" width="150" height="42" rx="5" fill="#efece5" stroke="#dcd8cf" stroke-width="1"/><text x="48" y="386.2" font-size="11" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">能否给前端</text><rect x="186" y="365.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="198" y="386.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">可以（含身份）</text><rect x="485.3" y="365.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="497.3" y="386.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">尽量避免（见 BFF）</text><rect x="784.7" y="365.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="796.7" y="386.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">绝不可以</text><rect x="36" y="407.2" width="150" height="42" rx="5" fill="#efece5" stroke="#dcd8cf" stroke-width="1"/><text x="48" y="428.2" font-size="11" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">撤销</text><rect x="186" y="407.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="198" y="428.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">靠短 TTL</text><rect x="485.3" y="407.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="497.3" y="428.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">短 TTL / 内省</text><rect x="784.7" y="407.2" width="294.3" height="42" rx="5" fill="#ffffff" stroke="#dcd8cf" stroke-width="1"/><text x="796.7" y="428.2" font-size="11" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">撤销端点 + 轮换</text><text x="36" y="467.2" font-size="11" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">一句话记法：ID Token 是给登录方看的身份证；Access Token 是给资源方看的门票；Refresh Token 是只给发证方用的续期凭据。跨角色乱用（拿 ID Token 调 API、把 Refresh Token 下发到浏览器）等于绕过整</text><text x="36" y="484.9" font-size="11" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">套信任设计。</text></svg>
