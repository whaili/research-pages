<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="414" viewBox="0 0 1120 414" role="img" aria-label="state / nonce / PKCE：三个参数，三种绑定"><title>state / nonce / PKCE：三个参数，三种绑定</title><rect width="1120" height="414" fill="#fbfaf7"/><text x="36" y="48" font-size="21" fill="#1a1a1a" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">state / nonce / PKCE：三个参数，三种绑定</text><text x="36" y="82" font-size="11.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">最容易混用的三个参数。区别不在随机不随机，而在各自把什么钉在一起</text><rect x="36" y="111.2" width="333.3" height="92" rx="9" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/><rect x="36" y="111.2" width="333.3" height="6" rx="3" fill="#2b6cb0" stroke="none" stroke-width="1"/><text x="202.7" y="132.2" font-size="16" fill="#2b6cb0" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">state</text><text x="202.7" y="158.5" font-size="12.5" fill="#666666" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">把「回调」绑到「本次会话」</text><rect x="44" y="228.6" width="5" height="5" rx="1" fill="#2b6cb0" stroke="none" stroke-width="1"/><text x="56" y="225.2" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">位置：授权请求 → 回调 URL</text><rect x="44" y="256.3" width="5" height="5" rx="1" fill="#2b6cb0" stroke="none" stroke-width="1"/><text x="56" y="252.9" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">校验方：RP 前端</text><rect x="44" y="284" width="5" height="5" rx="1" fill="#2b6cb0" stroke="none" stroke-width="1"/><text x="56" y="280.6" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">防御：CSRF / 登录劫持</text><line x1="44" y1="310.3" x2="361.3" y2="310.3" stroke="#dcd8cf" stroke-width="1"/><text x="44" y="324.3" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">攻击者无法预知受害者会话里的随机值</text><rect x="393.3" y="111.2" width="333.3" height="92" rx="9" fill="#ffffff" stroke="#2f855a" stroke-width="2"/><rect x="393.3" y="111.2" width="333.3" height="6" rx="3" fill="#2f855a" stroke="none" stroke-width="1"/><text x="560" y="132.2" font-size="16" fill="#2f855a" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">nonce</text><text x="560" y="158.5" font-size="12.5" fill="#666666" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">把「ID Token」绑到「本次请求」</text><rect x="401.3" y="228.6" width="5" height="5" rx="1" fill="#2f855a" stroke="none" stroke-width="1"/><text x="413.3" y="225.2" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">位置：授权请求 → ID Token 内</text><rect x="401.3" y="256.3" width="5" height="5" rx="1" fill="#2f855a" stroke="none" stroke-width="1"/><text x="413.3" y="252.9" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">校验方：RP 验 Token 时</text><rect x="401.3" y="284" width="5" height="5" rx="1" fill="#2f855a" stroke="none" stroke-width="1"/><text x="413.3" y="280.6" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">防御：Token 重放 / 注入</text><line x1="401.3" y1="310.3" x2="718.7" y2="310.3" stroke="#dcd8cf" stroke-width="1"/><text x="401.3" y="324.3" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">Token 里的 nonce 必须等于本次发起时存下的值</text><rect x="750.7" y="111.2" width="333.3" height="92" rx="9" fill="#ffffff" stroke="#b7791f" stroke-width="2"/><rect x="750.7" y="111.2" width="333.3" height="6" rx="3" fill="#b7791f" stroke="none" stroke-width="1"/><text x="917.3" y="132.2" font-size="16" fill="#b7791f" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">PKCE</text><text x="917.3" y="158.5" font-size="12.5" fill="#666666" font-weight="600" text-anchor="middle" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">把「授权码」绑到「发起它的客户端」</text><rect x="758.7" y="228.6" width="5" height="5" rx="1" fill="#b7791f" stroke="none" stroke-width="1"/><text x="770.7" y="225.2" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">位置：/authorize + /token</text><rect x="758.7" y="256.3" width="5" height="5" rx="1" fill="#b7791f" stroke="none" stroke-width="1"/><text x="770.7" y="252.9" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">校验方：OP</text><rect x="758.7" y="284" width="5" height="5" rx="1" fill="#b7791f" stroke="none" stroke-width="1"/><text x="770.7" y="280.6" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="start" dominant-baseline="auto" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">防御：code 拦截 / 注入</text><line x1="758.7" y1="310.3" x2="1076" y2="310.3" stroke="#dcd8cf" stroke-width="1"/><text x="758.7" y="324.3" font-size="10.5" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">S256(verifier) 先发指纹，换 token 时再交原值</text><text x="36" y="338.2" font-size="11" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle" style="font-family:PingFang SC,Hiragino Sans GB,Songti SC,sans-serif">RFC 9700：public client 必须用 PKCE；confidential client 推荐用；challenge 必须逐事务随机并绑定发起时的浏览器会话。三者可以叠加，但不能互相替代——少一个就少一层防护。</text></svg>
